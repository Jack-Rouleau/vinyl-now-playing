<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121411">
  <title>Now Playing</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/mosaic.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body data-state="idle">
  <div id="mosaic" role="group" aria-label="Saved albums" hidden></div>
  <div id="collection-message" role="status" hidden></div>
  <main>
    <section id="track" class="playing" aria-label="Current song" hidden>
      <img id="artwork" src="/artwork.svg" alt="Album artwork" width="800" height="800">
      <div class="metadata" aria-live="polite" aria-atomic="true">
        <h1 id="title"></h1>
        <p id="artist"></p>
        <p id="album" hidden></p>
      </div>
    </section>
  </main>
  <aside id="next-song" aria-live="polite" hidden>
    <span class="next-label">Next song:</span>
    <span id="next-title"></span>
  </aside>
  <div id="activity" role="status" aria-live="polite">
    <span class="activity-dot" aria-hidden="true"></span>
    <span id="activity-text">Listening</span>
  </div>
</body>
</html>
