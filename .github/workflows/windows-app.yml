name: Windows app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install ".[live,dev]" "pyinstaller>=6.16,<7"
      - name: Verify source
        run: |
          ruff check .
          ruff format --check .
          python -m unittest discover -s tests
      - name: Prepare bundled model
        run: |
          python -c "from pathlib import Path; from now_playing.model_setup import ensure_model; ensure_model(Path('models/yamnet'))"
      - name: Freeze Windows application
        run: pyinstaller --noconfirm packaging/windows.spec
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'frozen-smoke.json'
          $app = Join-Path $PWD 'dist/Now Playing/Now Playing.exe'
          $process = Start-Process -FilePath $app -ArgumentList @('--self-test', $report) -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Frozen smoke failed: $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'Frozen executable did not write its report' }
          if (-not (Get-Content $report -Raw | ConvertFrom-Json).passed) { throw 'Frozen checks did not pass' }
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify installer and installed application
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'Installed Now Playing'
          $installer = Join-Path $PWD 'dist/installer/Now-Playing-Windows-Setup.exe'
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $report = Join-Path $PWD 'installed-smoke.json'
          $check = Start-Process -FilePath (Join-Path $destination 'Now Playing.exe') -ArgumentList @('--self-test', $report) -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($check.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Installed application smoke failed' }
          if (-not (Get-Content $report -Raw | ConvertFrom-Json).passed) { throw 'Installed checks did not pass' }
          Get-FileHash $installer -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Now-Playing-Windows-Setup
          path: dist/installer/Now-Playing-Windows-Setup.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-diagnostics
          path: |
            *smoke.json
            build/windows/warn-*.txt
          retention-days: 14
